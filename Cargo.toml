[package]
name = "corral"
version = "0.1.0"
edition = "2024"
description = "Independent desktop icon organizer for Windows"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `windows-core` is a direct dependency because `#[implement]` expands to `::windows_core::...` paths;
# the `windows` crate's `implement` feature generates the `I*_Impl` traits for COM objects (dragdrop.rs).
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Foundation_Numerics",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Touch",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Corral's pixel loops (Camouflage, tint, scrollbar) are unusably slow unoptimised: drag renders took ~37 ms
# at opt-level 0 (verification 2026-10-13). Level 1 keeps debug info and fast-ish builds.
opt-level = 1
